[project]
name = "fbscout"
version = "0.2.1"
description = "Search Facebook for a keyword, screenshot matching posts/comments and save JSON metadata (research tool)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "playwright>=1.48",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]   # only for `fbscout db export --format parquet`

[project.scripts]
fbscout = "fbscout.cli:main"
fbscout-mcp = "fbscout.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
